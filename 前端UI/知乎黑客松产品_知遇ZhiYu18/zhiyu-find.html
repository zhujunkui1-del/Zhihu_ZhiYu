<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="知遇 · 发现 —— 今天，要和谁相遇？">
  <title>知遇 · 发现</title>
  <style>
    :root {
      --bg:      #eef3fc;
      --surface: #ffffff;
      --fg:      #16263f;
      --muted:   #5d6c88;
      --border:  #d7e1f1;
      --accent:  #0d64fd;
      --accent-soft: color-mix(in oklch, var(--accent) 13%, transparent);
      --accent-faint: color-mix(in oklch, var(--accent) 5%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --fg-softer: color-mix(in oklch, var(--fg) 3%, transparent);
      --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'Source Han Serif CN', 'Songti SC', 'STSong', 'SimSun', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
      --fs-h1: clamp(28px, 3vw, 38px);
      --fs-h2: clamp(21px, 2.2vw, 28px);
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 28px;
      --radius: 10px;
      --radius-lg: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3 { text-wrap: balance; }
    h1, h2 { font-family: var(--font-display); }
    h1 { font-size: var(--fs-h1); line-height: 1.25; margin: 0; letter-spacing: 0.01em; }
    h2 { font-size: var(--fs-h2); line-height: 1.3; margin: 0; }
    h3 { font-size: 16.5px; margin: 0; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 84%, black); border-color: color-mix(in oklch, var(--accent) 84%, black); }
    .btn-primary[disabled] { opacity: 0.7; cursor: default; }
    .btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--accent); background: var(--accent-faint); }
    .btn-ghost { background: transparent; color: var(--fg); padding-inline: 6px; }
    .btn-ghost:hover { color: var(--accent); }
    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }
    .btn-arrow:hover::after { transform: translateX(3px); }

    /* ─── 应用壳（与首页一致） ─────────────────────────────────── */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 248px;
      z-index: 20;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 18px 14px 16px;
    }
    .side-brand { display: block; padding: 2px 6px 0; }
    .brand-row { display: inline-flex; align-items: center; gap: 11px; }
    .brand-plate {
      width: 42px; height: 42px;
      border-radius: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      box-shadow: 0 8px 20px color-mix(in oklch, var(--fg) 8%, transparent);
      overflow: hidden;
    }
    .brand-plate img { width: 37px; height: auto; }
    .brand-word { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.14em; }
    .brand-tag { display: block; margin-top: 2px; color: var(--muted); font-size: 10.5px; letter-spacing: 0.08em; }
    .side-nav { display: flex; flex-direction: column; gap: 5px; margin-top: 26px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      min-height: 46px;
      padding: 9px 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--fg);
      font-size: 14.5px;
      font-weight: 500;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item svg { width: 19px; height: 19px; flex: 0 0 auto; color: var(--muted); transition: color 0.15s ease; }
    .nav-item:hover { background: var(--fg-soft); }
    .nav-item.active { background: var(--accent); color: var(--surface); }
    .nav-item.active svg { color: var(--surface); }
    .side-foot {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .zh-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--fg-soft);
      color: var(--fg);
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-size: 17px;
      border: 1px solid var(--border);
    }
    .side-foot .nav-item { flex: 1; min-height: 42px; }
    .main { flex: 1; margin-left: 248px; min-width: 0; padding: 34px clamp(22px, 4vw, 54px) 72px; }
    .main-inner { max-width: 1180px; margin-inline: auto; }

    /* ─── 页头与页签 ───────────────────────────────────────────── */
    .find-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
    .find-head h1 { max-width: 16ch; }
    .find-head .sub { margin: 10px 0 0; color: var(--muted); font-size: 14.5px; max-width: 62ch; }
    .head-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in oklch, var(--surface) 78%, transparent);
      color: var(--muted);
      font-size: 12.5px;
      white-space: nowrap;
    }
    .seg {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: color-mix(in oklch, var(--surface) 70%, transparent);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .seg button {
      min-height: 42px;
      padding: 8px 18px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .seg button:hover { color: var(--fg); }
    .seg button.active { background: var(--fg); color: var(--surface); }

    .tab-panel[hidden] { display: none; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
    }
    .panel + .panel { margin-top: 18px; }
    .panel-eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.12em; color: var(--muted); margin: 0 0 8px; }

    /* ─── 搜索 ─────────────────────────────────────────────────── */
    .search-box { display: flex; gap: 10px; align-items: center; }
    .search-input {
      flex: 1;
      display: flex; align-items: center; gap: 10px;
      background: var(--fg-softer);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 0 14px;
      min-height: 50px;
    }
    .search-input svg { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; }
    .search-input input {
      flex: 1; min-width: 0;
      border: 0; background: transparent;
      font: inherit; font-size: 15px;
      color: var(--fg);
      padding: 12px 0;
    }
    .search-input input:focus { outline: none; }
    .search-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
    .search-box .btn { flex: 0 0 auto; }

    .filters {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .filter-field { position: relative; display: flex; align-items: center; gap: 9px; }
    .filter-field label { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .filter-field::after {
      content: '';
      position: absolute;
      right: 13px;
      top: 50%;
      width: 7px; height: 7px;
      border-right: 1.6px solid var(--muted);
      border-bottom: 1.6px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    .filter-field select {
      min-height: 40px;
      padding: 7px 32px 7px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: 13.5px;
      appearance: none;
      cursor: pointer;
    }
    .switch-wrap { display: inline-flex; align-items: center; gap: 9px; margin-left: auto; }
    .switch-wrap span { font-size: 13px; color: var(--muted); }
    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .switch i {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 999px;
      transition: background 0.18s ease;
      pointer-events: none;
    }
    .switch i::after {
      content: '';
      position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--surface);
      transition: transform 0.18s ease;
      box-shadow: 0 1px 3px color-mix(in oklch, var(--fg) 22%, transparent);
    }
    .switch input:checked + i { background: color-mix(in oklch, var(--fg) 52%, transparent); }
    .switch input:checked + i::after { transform: translateX(16px); }

    .result-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin: 22px 0 12px;
      color: var(--muted); font-size: 13px;
    }
    .reset-btn {
      border: 0; background: transparent; color: var(--muted);
      font-size: 12.5px; min-height: 40px; padding: 0 6px;
    }
    .reset-btn:hover { color: var(--accent); }

    /* ─── 候选人格卡 ───────────────────────────────────────────── */
    .cand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
    .persona-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex; flex-direction: column;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .persona-card:hover { border-color: color-mix(in oklch, var(--accent) 36%, var(--border)); box-shadow: 0 12px 30px color-mix(in oklch, var(--fg) 7%, transparent); }
    .p-head { display: flex; align-items: center; gap: 12px; }
    .p-avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--fg-soft);
      color: var(--fg);
      display: grid; place-items: center;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      flex: 0 0 auto;
      border: 1px solid var(--border);
    }
    .p-title { font-size: 15.5px; font-weight: 600; }
    .p-pill {
      display: inline-flex; align-items: center;
      margin-top: 3px;
      padding: 2px 8px;
      background: var(--fg-soft);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .p-meta { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; }
    .p-meta li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg); }
    .p-meta svg { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
    .p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
    .p-tag {
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .p-actions {
      display: flex; align-items: center; gap: 4px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .p-actions .btn { min-height: 40px; padding: 7px 10px; font-size: 13px; }
    .sim-block { margin: 14px 0 0; }
    .sim-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
    .sim-top .num { color: var(--fg); font-weight: 600; font-size: 14px; }
    .track { height: 7px; border-radius: 999px; background: var(--fg-soft); overflow: hidden; }
    .track i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

    .demo-note {
      margin: 18px 0 0;
      padding: 11px 14px;
      background: var(--accent-faint);
      border-radius: 12px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.75;
    }
    .empty-state { text-align: center; padding: 44px 20px 36px; color: var(--muted); }
    .empty-state .big { font-family: var(--font-display); font-size: 20px; color: var(--fg); margin-bottom: 8px; }
    .empty-state p { margin: 0 auto; max-width: 40ch; font-size: 13.5px; line-height: 1.75; }

    /* ─── 随机推荐 ─────────────────────────────────────────────── */
    .random-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
    .random-head h2 { max-width: 22ch; }
    .random-head p { margin: 8px 0 0; color: var(--muted); font-size: 13.5px; max-width: 56ch; line-height: 1.75; }

    /* ─── 快速匹配 ─────────────────────────────────────────────── */
    .quick-intro { max-width: 60ch; }
    .quick-intro p { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .req-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .req-chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--muted);
    }
    .req-chip b { font-weight: 600; color: var(--fg); }
    .quick-actions { display: flex; align-items: center; gap: 14px; margin-top: 20px; flex-wrap: wrap; }
    .quick-hint { color: var(--muted); font-size: 12.5px; max-width: 44ch; line-height: 1.7; }
    .quick-result { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .quick-result[hidden] { display: none; }
    .quick-result > h3 { margin-bottom: 4px; }
    .quick-result > .meta { display: block; margin-bottom: 16px; }

    /* ─── 人格卡弹窗 ───────────────────────────────────────────── */
    .modal {
      position: fixed; inset: 0; z-index: 50;
      display: none;
      place-items: center;
      padding: 22px;
    }
    .modal.open { display: grid; }
    .modal-backdrop { position: absolute; inset: 0; background: color-mix(in oklch, var(--fg) 48%, transparent); backdrop-filter: blur(3px); }
    .modal-dialog {
      position: relative;
      width: min(100%, 560px);
      max-height: min(86vh, 760px);
      overflow: auto;
      background: var(--surface);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 36px 110px color-mix(in oklch, var(--fg) 40%, transparent);
    }
    .modal-close {
      position: absolute; top: 14px; right: 14px;
      width: 40px; height: 40px;
      border: 0; border-radius: 50%;
      background: transparent;
      color: var(--muted);
      display: grid; place-items: center;
    }
    .modal-close:hover { background: var(--fg-soft); color: var(--fg); }
    .modal-close svg { width: 18px; height: 18px; }
    .profile-title { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .profile-title .p-avatar { width: 56px; height: 56px; font-size: 15px; }
    .profile-section { margin-top: 18px; }
    .profile-section h3 { font-size: 15px; margin-bottom: 8px; }
    .profile-section p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.8; }
    .source-state { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 7px; }
    .source-state li { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0 0; border-top: 1px solid var(--border); }
    .source-state li span:first-child { color: var(--fg); }
    .source-state li span:last-child { color: var(--muted); font-size: 12.5px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .modal-actions .btn { flex: 1; }
    .modal-radar { display: grid; place-items: center; padding: 8px 0 2px; }
    .modal-radar svg { width: min(100%, 300px); height: auto; }
    .modal-radar .mgrid { fill: none; stroke: var(--border); }
    .modal-radar .mgrid2 { fill: none; stroke: color-mix(in oklch, var(--accent) 24%, var(--border)); }
    .modal-radar .maxis { stroke: var(--border); }
    .modal-radar .mval { fill: color-mix(in oklch, var(--accent) 16%, transparent); stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
    .modal-radar .mdot { fill: var(--accent); }
    .modal-radar text.mname { fill: var(--muted); font-family: var(--font-mono); font-size: 10.5px; text-anchor: middle; }
    .source-state a { color: var(--accent); font-size: 12.5px; text-decoration: none; }
    .source-state a:hover { text-decoration: underline; }

    /* ─── 提示条 ───────────────────────────────────────────────── */
    .toast {
      position: fixed;
      left: 50%; bottom: 26px;
      transform: translate(-50%, 12px);
      z-index: 70;
      background: var(--fg);
      color: var(--surface);
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      box-shadow: 0 16px 44px color-mix(in oklch, var(--fg) 30%, transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: min(86vw, 480px);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 920px) {
      .app-shell { flex-direction: column; }
      .sidebar {
        position: static;
        width: 100%; height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
      }
      .side-nav { flex-direction: row; flex-wrap: wrap; margin-top: 12px; gap: 6px; flex: none; }
      .nav-item { width: auto; min-height: 42px; padding: 8px 12px; font-size: 13.5px; }
      .side-foot { margin-top: 10px; border-top: 0; padding-top: 0; }
      .main { margin-left: 0; padding: 26px 18px 60px; }
      .panel { padding: 18px; }
      .search-box { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
      .search-box .btn { width: 100%; }
      .switch-wrap { margin-left: 0; width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="./zhiyu-theme.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo/logo-32.png">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-od-id="sidebar">
      <a class="side-brand" href="zhiyu-login.html" aria-label="知遇 Logo，返回登录页">
        <span class="brand-row">
          <span class="brand-plate"><img class="brand-logo" src="./assets/logo/logo-104.png" srcset="./assets/logo/logo-52.png 1x, ./assets/logo/logo-104.png 2x, ./assets/logo/logo-256.png 4x" width="104" height="104" alt=""></span>
          <span>
            <span class="brand-word">知遇</span>
            <span class="brand-tag meta">先认识，再相遇</span>
          </span>
        </span>
      </a>

      <nav class="side-nav" aria-label="主导航" data-od-id="side-nav">
        <button class="nav-item" type="button" data-nav="首页" data-href="zhiyu-home.html" data-od-id="nav-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z"></path></svg>
          <span>首页</span>
        </button>
        <button class="nav-item active" type="button" data-nav="发现" data-od-id="nav-find" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.8 8.2-2.6 5.2-5.2 2.6 2.6-5.2z"></path></svg>
          <span>发现</span>
        </button>
        <button class="nav-item" type="button" data-nav="我的人格" data-href="zhiyu-persona.html" data-od-id="nav-persona">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-3.9 3.6-6 8-6s8 2.1 8 6"></path></svg>

        { p: '四川', c: ['成都', '自贡', '攀枝花', '泸州', '德阳', '绵阳', '广元', '遂宁', '内江', '乐山', '南充', '眉山', '宜宾', '广安', '达州', '雅安', '巴中', '资阳', '阿坝藏族羌族自治州', '甘孜藏族自治州', '凉山彝族自治州'] },
        { p: '贵州', c: ['贵阳', '六盘水', '遵义', '安顺', '毕节', '铜仁', '黔西南布依族苗族自治州', '黔东南苗族侗族自治州', '黔南布依族苗族自治州'] },
        { p: '云南', c: ['昆明', '曲靖', '玉溪', '保山', '昭通', '丽江', '普洱', '临沧', '楚雄彝族自治州', '红河哈尼族彝族自治州', '文山壮族苗族自治州', '西双版纳傣族自治州', '大理白族自治州', '德宏傣族景颇族自治州', '怒江傈僳族自治州', '迪庆藏族自治州'] },
        { p: '西藏', c: ['拉萨', '日喀则', '昌都', '林芝', '山南', '那曲', '阿里地区'] },
        { p: '陕西', c: ['西安', '铜川', '宝鸡', '咸阳', '渭南', '延安', '汉中', '榆林', '安康', '商洛'] },
        { p: '甘肃', c: ['兰州', '嘉峪关', '金昌', '白银', '天水', '武威', '张掖', '平凉', '酒泉', '庆阳', '定西', '陇南', '临夏回族自治州', '甘南藏族自治州'] },
        { p: '青海', c: ['西宁', '海东', '海北藏族自治州', '黄南藏族自治州', '海南藏族自治州', '果洛藏族自治州', '玉树藏族自治州', '海西蒙古族藏族自治州'] },
        { p: '宁夏', c: ['银川', '石嘴山', '吴忠', '固原', '中卫'] },
        { p: '新疆', c: ['乌鲁木齐', '克拉玛依', '吐鲁番', '哈密', '昌吉回族自治州', '博尔塔拉蒙古自治州', '巴音郭楞蒙古自治州', '克孜勒苏柯尔克孜自治州', '伊犁哈萨克自治州', '阿克苏地区', '喀什地区', '和田地区', '塔城地区', '阿勒泰地区'] },
        { p: '台湾', c: ['台北', '新北', '桃园', '台中', '台南', '高雄', '基隆', '新竹', '嘉义', '新竹县', '苗栗县', '彰化县', '南投县', '云林县', '嘉义县', '屏东县', '宜兰县', '花莲县', '台东县', '澎湖县', '金门县', '连江县'] },
        { p: '香港', c: ['香港'] },
        { p: '澳门', c: ['澳门'] }
      ];
      function locText(p) {
        if (p.prov && p.city && p.city !== p.prov) return p.prov + ' · ' + p.city;
        return p.city || p.prov || '—';
      }

      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

      function cardHtml(p, withSim) {
        var sim = withSim ? '<div class="sim-block"><div class="sim-top"><span>与你的相似度</span><span class="num">' + p.sim + '%</span></div><div class="track"><i style="width:' + p.sim + '%;"></i></div></div>' : '';
        return '<article class="persona-card" data-id="' + esc(p.id) + '" data-city="' + esc(p.city) + '" data-type="' + esc(p.type) + '" data-agent="' + (p.agent ? '1' : '0') + '" data-od-id="persona-card-' + esc(p.id) + '">' +
          '<div class="p-head"><span class="p-avatar">' + esc(p.code) + '</span><div><div class="p-title">' + esc(p.title) + '</div><span class="p-pill">AI 演示人格</span></div></div>' +
          '<ul class="p-meta">' +
          '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 21s-7-5.1-7-11a7 7 0 1 1 14 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>' + esc(locText(p)) + '</li>' +
          '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.9 3.6-6 8-6s8 2.1 8 6"/></svg>' + esc(p.type) + '</li>' +
          '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' + (p.agent ? '接受 Agent 对话' : '暂未开放 Agent 对话') + '</li>' +
          '</ul>' +
          '<div class="p-tags">' + p.tags.map(function (t) { return '<span class="p-tag">' + esc(t) + '</span>'; }).join('') + '</div>' + sim +
          '<div class="p-actions">' +
          '<button class="btn btn-ghost btn-arrow" type="button" data-action="profile">查看人格卡</button>' +
          (p.agent ? '<button class="btn btn-primary" type="button" data-action="chat">让 Agent 先聊聊</button>' : '') +
          '</div></article>';
      }

      /* 空态文案：卡片与雷达共用 */
      function emptyStateHtml() {
        return '<div class="empty-state" style="grid-column: 1 / -1;"><div class="big">没有符合条件的结果</div>' +
          '<p>试试清空筛选，或换一个关键词——也可能是 TA 还没有开放 Agent 对话。</p></div>';
      }

      function renderList(containerId, list, withSim) {
        var box = document.getElementById(containerId);
        if (!box) return;
        if (!list.length) { box.innerHTML = emptyStateHtml(); return; }
        box.innerHTML = list.map(function (p) { return cardHtml(p, withSim); }).join('');
      }

      /* ── 结果展示方式：卡片 / 相遇雷达 ───────────────────────────────────
         两种视图共用同一份筛选结果，切换时互不丢失。
         view 状态按区域（search / random / quick）分别记忆。 */
      var viewState = { search: 'grid', random: 'grid', quick: 'grid' };
      var lastResult = { search: [], random: [], quick: [] };

      function radarBoxId(area) { return 'radar-' + area; }
      function gridBoxId(area) {
        return area === 'search' ? 'search-results' : area === 'random' ? 'random-results' : 'quick-results';
      }

      /* 渲染指定区域：按当前视图画卡片或雷达 */
      function paintResults(area, list, withSim) {
        lastResult[area] = list;
        var gridPane = document.querySelector('[data-view-pane="' + area + '"]');
        var radarPane = document.querySelector('[data-view-pane="radar-' + area + '"]');
        var wantRadar = viewState[area] === 'radar';

        if (gridPane) gridPane.hidden = wantRadar;
        if (radarPane) radarPane.hidden = !wantRadar;

        if (wantRadar) {
          if (window.ZhiyuRadar) {
            window.ZhiyuRadar.render(document.getElementById(radarBoxId(area)), list, { area: area });
          }
        } else {
          renderList(gridBoxId(area), list, withSim);
        }
      }

      /* 切换区域视图 */
      function setView(area, view) {
        viewState[area] = view === 'radar' ? 'radar' : 'grid';
        var seg = document.querySelector('[data-view-seg="' + area + '"]');
        if (seg) {
          Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
            var on = b.getAttribute('data-view') === viewState[area];
            b.classList.toggle('active', on);
            b.setAttribute('aria-selected', on ? 'true' : 'false');
          });
        }
        var withSim = area !== 'search';
        paintResults(area, lastResult[area] || [], withSim);
      }

      Array.prototype.forEach.call(document.querySelectorAll('[data-view-seg]'), function (seg) {
        var area = seg.getAttribute('data-view-seg');
        seg.addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('[data-view]') : null;
          if (!b) return;
          setView(area, b.getAttribute('data-view'));
        });
      });

      function all() { return personas.slice(); }

      /* 人物头像：知乎头像抓不到时，按 id 确定性映射到本地角色插画。
         确定性很重要——否则同一人在雷达上与弹窗里会换成两张脸。 */
      var AVATAR_POOL = ['linyue', 'chenyu', 'suqing', 'limeng', 'zhaoyi', 'zhouming', 'newfriend'];
      function avatarFor(p) {
        if (p.avatarUrl) return p.avatarUrl;
        var key = String(p.id || p.code || p.title || '');
        var h = 0;
        for (var i = 0; i < key.length; i += 1) h = (h * 31 + key.charCodeAt(i)) % 100000;
        return './assets/characters/' + AVATAR_POOL[h % AVATAR_POOL.length] + '.webp';
      }

      function visiblePersona(id) {
        for (var i = 0; i < personas.length; i += 1) if (personas[i].id === id) return personas[i];
        return null;
      }

      /* 页签 */
      var tabs = document.querySelectorAll('[data-tab]');
      var panels = {
        search: document.getElementById('tab-search'),
        random: document.getElementById('tab-random'),
        quick: document.getElementById('tab-quick')
      };
      function switchTab(name) {
        Array.prototype.forEach.call(tabs, function (tab) {
          var on = tab.getAttribute('data-tab') === name;
          tab.classList.toggle('active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        Object.keys(panels).forEach(function (key) { panels[key].hidden = key !== name; });
      }
      Array.prototype.forEach.call(tabs, function (tab) {
        tab.addEventListener('click', function () { switchTab(tab.getAttribute('data-tab')); });
      });

      /* 搜索 + 筛选（所在地：省/直辖市 → 市 级联） */
      var searchQ = document.getElementById('search-q');
      var provSel = document.getElementById('filter-prov');
      var citySel = document.getElementById('filter-city');
      REGIONS.forEach(function (r) {
        var o = document.createElement('option');
        o.value = r.p;
        o.textContent = r.p;
        provSel.appendChild(o);
      });
      function fillCityOptions(prov) {
        citySel.innerHTML = '<option value="">全部城市</option>';
        if (!prov) { citySel.disabled = true; return; }
        var cities = [];
        REGIONS.forEach(function (r) { if (r.p === prov) cities = r.c; });
        cities.forEach(function (c) {
          var o = document.createElement('option');
          o.value = c;
          o.textContent = c;
          citySel.appendChild(o);
        });
        citySel.disabled = false;
      }
      function applySearch(ev) {
        if (ev) ev.preventDefault();
        var q = (searchQ.value || '').trim().toLowerCase();
        var prov = provSel.value;
        var city = citySel.disabled ? '' : citySel.value;
        var type = document.getElementById('filter-persona').value;
        var onlyAgent = document.getElementById('filter-agent').checked;
        var list = all().filter(function (p) {
          var hay = (p.title + ' ' + locText(p) + ' ' + p.tags.join(' ') + ' ' + p.type).toLowerCase();
          var ok = true;
          if (q) ok = ok && hay.indexOf(q) > -1;
          if (prov) ok = ok && p.prov === prov;
          if (city) ok = ok && p.city === city;
          if (type) ok = ok && p.type === type;
          if (onlyAgent) ok = ok && p.agent;
          return ok;
        });
        paintResults('search', list, false);
        document.getElementById('result-count').textContent = '共 ' + list.length + ' 位结果';
      }
      document.getElementById('search-form').addEventListener('submit', applySearch);
      document.getElementById('filter-prov').addEventListener('change', function () {
        fillCityOptions(provSel.value);
        applySearch();
      });
      ['filter-city', 'filter-persona', 'filter-agent'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', applySearch);
      });
      /* radar-boot */
      applySearch();

      document.getElementById('reset-filters').addEventListener('click', function () {
        searchQ.value = '';
        provSel.value = '';
        fillCityOptions('');
        document.getElementById('filter-persona').value = '';
        document.getElementById('filter-agent').checked = false;
        applySearch();
      });

      /* 随机推荐：随机打乱后取 8 位（雷达图上人多一些才看得出分布） */
      function renderRandom() {
        var pool = all().slice();
        for (var i = pool.length - 1; i > 0; i -= 1) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        }
        paintResults('random', pool.slice(0, 8), true);
      }
      document.getElementById('reroll-btn').addEventListener('click', renderRandom);

      /* 快速匹配 */
      var quickRun = document.getElementById('quick-run');
      quickRun.addEventListener('click', function () {
        quickRun.disabled = true;
        quickRun.textContent = '正在匹配…';
        setTimeout(function () {
          var ranked = all().slice().sort(function (a, b) { return b.sim - a.sim; }).slice(0, 10);
          paintResults('quick', ranked, true);
          document.getElementById('quick-result').hidden = false;
          quickRun.textContent = '重新匹配';
          quickRun.disabled = false;
          showToast('匹配完成：已按相似度为你排序十位候选人。');
        }, 1000);
      });

      /* 弹窗与行内操作 */
      var modal = document.getElementById('persona-modal');
      var activePersonaId = null;
      var MDIMS = ['深度思考偏好', '表达外放度', '兴趣广度', '成长体验取向', '外向程度'];
      function modalRadarHtml(vals) {
        var n = MDIMS.length, cx = 140, cy = 150, R = 84, i;
        function ang(i) { return (-90 + i * (360 / n)) * Math.PI / 180; }
        var svg = '<svg viewBox="0 0 280 300" role="img" aria-label="人格雷达示意">';
        var verts = [];
        for (i = 0; i < n; i += 1) {
          var a = ang(i);
          verts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
        }
        [0.25, 0.5, 0.75, 1].forEach(function (t, k) {
          var ring = verts.map(function (pt) {
            return [(cx + (pt[0] - cx) * t).toFixed(1), (cy + (pt[1] - cy) * t).toFixed(1)];
          }).join(' ');
          svg += '<polygon class="' + (k === 3 ? 'mgrid2' : 'mgrid') + '" points="' + ring + '"></polygon>';
        });
        verts.forEach(function (pt) {
          svg += '<line class="maxis" x1="140" y1="150" x2="' + pt[0].toFixed(1) + '" y2="' + pt[1].toFixed(1) + '"></line>';
        });
        MDIMS.forEach(function (nm, i) {
          var a2 = ang(i), lx = cx + (R + 22) * Math.cos(a2), ly = cy + (R + 22) * Math.sin(a2);
          svg += '<text class="mname" x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '">' + nm + '</text>';
        });
        var pts = [];
        for (i = 0; i < n; i += 1) {
          var a3 = ang(i), rr = Math.max(0.05, Math.min(1, vals[i] || 0)) * R;
          pts.push([cx + rr * Math.cos(a3), cy + rr * Math.sin(a3)]);
        }
        svg += '<polygon class="mval" points="' + pts.map(function (pt) { return pt[0].toFixed(1) + ' ' + pt[1].toFixed(1); }).join(' ') + '"></polygon>';
        pts.forEach(function (pt) {
          svg += '<circle class="mdot" cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) + '" r="3.2"></circle>';
        });
        svg += '</svg>';
        return svg;
      }
      function openProfile(id) {
        var p = visiblePersona(id);
        if (!p) return;
        activePersonaId = id;
        /* 头像：知乎头像抓不到时，按 id 确定性取本地角色插画 */
        var av = avatarFor(p);
        document.getElementById('modal-avatar').innerHTML =
          '<img src="' + av + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">';
        document.getElementById('modal-title').textContent = p.title;
        document.getElementById('modal-desc').textContent = p.desc;
        document.getElementById('modal-city').textContent = locText(p);
        document.getElementById('modal-type').textContent = p.type;
        document.getElementById('modal-agent').textContent = p.agent ? '接受' : '暂未开放';
        document.getElementById('modal-tags').innerHTML = (p.tags || []).map(function (t) {
          return '<span class="p-tag">' + esc(t) + '</span>';
        }).join('');
        document.getElementById('modal-radar').innerHTML = modalRadarHtml(p.radar || []);
        document.getElementById('modal-sim').textContent = (typeof p.sim === 'number' ? p.sim : 0) + '%';
        document.getElementById('modal-sim-bar').style.width = (typeof p.sim === 'number' ? p.sim : 0) + '%';
        document.getElementById('modal-zh-name').textContent = p.title;
        document.getElementById('modal-zh-link').href = 'https://www.zhihu.com/search?type=people&q=' + encodeURIComponent(p.title);
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        modal.querySelector('.modal-close').focus();
      }
      /* 供相遇雷达等外部组件调用 */
      window.openProfile = openProfile;
      function closeModal() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
      }
      modal.querySelectorAll('[data-close]').forEach(function (el) {
        el.addEventListener('click', closeModal);
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
      document.getElementById('modal-chat').addEventListener('click', function () {
        var p = visiblePersona(activePersonaId);
        closeModal();
        if (p && p.agent) startMeet(p);
        else showToast('该人格暂未开放 Agent 对话，可先快速匹配。');
      });

      /* 「让我的 Agent 先聊聊」：
         两个 Agent 转到后台对话，**停留当前页**，只弹一条提示。
         不跳转到 Agent 匹配页 —— 用户要留在原地继续浏览。
         （早期实现在这里 window.location.href 跳页，已移除） */
      function startMeet(p) {
        if (!p) return;
        /* 记下这次发起，供 Agent 匹配页识别（后台会话的锚点） */
        try {
          localStorage.setItem('zhiyu-match-focus', 'm' + p.code);
          localStorage.setItem('zhiyu-pending-meet', JSON.stringify({
            id: p.id, title: p.title, code: p.code, at: Date.now(),
          }));
        } catch (e) { /* localStorage 不可用时忽略，不影响提示 */ }
        showToast('你的 Agent 已在后台开始和 ' + p.title + ' 对话，有进展会通知你。');
        markAgentRunning();
      }

      /* 侧栏「Agent 匹配」上加一个小圆点，提示后台有会话在进行。
         这是"不跳页"的必要补偿：否则用户没有任何线索知道任务已启动。 */
      function markAgentRunning() {
        var nav = document.querySelector('[data-nav="Agent 匹配"]');
        if (!nav || nav.querySelector('.nav-running-dot')) return;
        var dot = document.createElement('span');
        dot.className = 'nav-running-dot';
        dot.setAttribute('aria-label', '后台有进行中的 Agent 对话');
        nav.appendChild(dot);
      }

      document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var card = btn.closest('.persona-card');
        var id = card ? card.getAttribute('data-id') : null;
        var p = visiblePersona(id);
        if (btn.getAttribute('data-action') === 'profile' && p) openProfile(p.id);
        if (btn.getAttribute('data-action') === 'chat') {
          if (p && p.agent) startMeet(p);
          else showToast('该人格暂未开放 Agent 对话，可先快速匹配。');
        }
      });

      /* 侧边栏 */
      Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (btn) {
        btn.addEventListener('click', function () {
          if (btn.classList.contains('active')) return;
          var href = btn.getAttribute('data-href');
          if (href) { window.location.href = href; return; }
          showToast('「' + btn.getAttribute('data-nav') + '」页面暂未开放。');
        });
      });

      applySearch();
      renderRandom();

      /* 首页“快速匹配预览”→ ?tab=quick 直达：切到快速匹配页签并自动跑一次 */
      (function () {
        var m = /[?&]tab=([^&]+)/.exec(window.location.search || '');
        var tabName = m ? decodeURIComponent(m[1]) : null;
        if (tabName && panels[tabName]) {
          switchTab(tabName);
          if (tabName === 'quick') {
            var runBtn = document.getElementById('quick-run');
            if (runBtn) runBtn.click();
          }
        }
      })();
    })();
  </script>


  <script src="./zhiyu-avatar.js"></script>
